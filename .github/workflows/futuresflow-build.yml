name: FuturesFlow Android APK (corrected)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: futuresflow-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project is at repository root
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$GITHUB_WORKSPACE/settings.gradle.kts"
          test -f "$GITHUB_WORKSPACE/build.gradle.kts"
          test -f "$GITHUB_WORKSPACE/app/build.gradle.kts"
          grep -F 'include(":app")' "$GITHUB_WORKSPACE/settings.gradle.kts"
          echo "Repository root: $GITHUB_WORKSPACE"
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort | head -200

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify app module tasks
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon -p "$GITHUB_WORKSPACE" :app:tasks --all

      - name: Build debug APK from repository root
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace -p "$GITHUB_WORKSPACE" :app:assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euxo pipefail
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: futuresflow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
